<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRSH Admin Dashboard</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

.login-box{
  max-width:400px;
  margin:100px auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  box-sizing:border-box;
}

button{
  padding:10px;
  border:none;
  background:black;
  color:white;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
}

th{
  background:black;
  color:white;
}
</style>
</head>
<body>

<div id="loginPage" class="login-box">
  <h2>Organizer Login</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="loginError" style="color:red;"></p>
</div>

<div id="dashboard" style="display:none;">
  <div class="container">

    <h1>TRSH Admin Dashboard</h1>

    <p>Total Entries: <span id="totalEntries">0</span></p>

    <input type="text" id="search" placeholder="Search entries...">

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Surname</th>
          <th>Centre</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="entriesTable"></tbody>
    </table>

  </div>
</div>

<script>
const ADMIN_USERNAME = "TRSHAdmin";
const ADMIN_PASSWORD = "TRSH2026!";

function login(){

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  if(
    username === ADMIN_USERNAME &&
    password === ADMIN_PASSWORD
  ){

    sessionStorage.setItem("adminLoggedIn","true");

    document.getElementById("loginPage").style.display="none";
    document.getElementById("dashboard").style.display="block";

    location.reload();

  }else{

    document.getElementById("loginError").innerText =
    "Invalid username or password";

  }
}

if(sessionStorage.getItem("adminLoggedIn")==="true"){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("dashboard").style.display="block";
}
</script>

<script type="module">

if(sessionStorage.getItem("adminLoggedIn")!=="true"){
  throw new Error("Login required");
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "trsh-raffle.firebaseapp.com",
  projectId: "trsh-raffle",
  storageBucket: "trsh-raffle.firebasestorage.app",
  messagingSenderId: "415646638643",
  appId: "1:415646638643:web:35ea07e88f153a35b8f946"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("entriesTable");
const totalEntries = document.getElementById("totalEntries");

let allEntries = [];

async function loadEntries(){

  const snapshot = await getDocs(collection(db,"raffleEntries"));

  allEntries=[];

  snapshot.forEach((entry)=>{
    allEntries.push({
      id:entry.id,
      ...entry.data()
    });
  });

  renderEntries(allEntries);

  totalEntries.textContent = allEntries.length;
}

function renderEntries(entries){

  table.innerHTML="";

  entries.forEach((entry)=>{

    table.innerHTML += `
    <tr>
      <td>${entry.name}</td>
      <td>${entry.surname}</td>
      <td>${entry.centre}</td>
      <td>
        <button onclick="deleteEntry('${entry.id}')">
          Delete
        </button>
      </td>
    </tr>
    `;
  });
}

window.deleteEntry = async(id)=>{

  if(!confirm("Delete entry?")) return;

  await deleteDoc(doc(db,"raffleEntries",id));

  loadEntries();
};

document.getElementById("search")
.addEventListener("input",(e)=>{

  const term = e.target.value.toLowerCase();

  const filtered = allEntries.filter(entry =>
    entry.name.toLowerCase().includes(term) ||
    entry.surname.toLowerCase().includes(term) ||
    entry.centre.toLowerCase().includes(term)
  );

  renderEntries(filtered);
});

loadEntries();

</script>

</body>
</html>
