<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRSH Raffle</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid #ccc;
  border-radius:5px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:black;
  color:white;
  border:none;
  border-radius:5px;
  font-size:16px;
  cursor:pointer;
}

.success{
  text-align:center;
  color:green;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <h1>TRSH Raffle</h1>

  <form id="raffleForm">

    <input type="text" id="name" placeholder="Name" required>

    <input type="text" id="surname" placeholder="Surname" required>

    <input type="text" id="centre" placeholder="Spiritual Centre" required>

    <button type="submit">Submit Entry</button>

  </form>

  <div id="message" class="success"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "trsh-raffle.firebaseapp.com",
  projectId: "trsh-raffle",
  storageBucket: "trsh-raffle.firebasestorage.app",
  messagingSenderId: "415646638643",
  appId: "1:415646638643:web:35ea07e88f153a35b8f946",
  measurementId: "G-KB5VD9ZNHG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("raffleForm");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    const name = document.getElementById("name").value;
    const surname = document.getElementById("surname").value;
    const centre = document.getElementById("centre").value;

    await addDoc(
      collection(db, "raffleEntries"),
      {
        name,
        surname,
        centre,
        entryId: "TRSH-" + Date.now(),
        createdAt: new Date().toISOString()
      }
    );

    form.reset();

    document.getElementById("message").innerText =
      "Entry submitted successfully!";

  } catch (error) {

    alert("Error: " + error.message);

  }

});

</script>

</body>
</html>
